<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Best Seller | Ngagemos</title>

<style>
body{
  margin:0;
  font-family: 'Poppins', Arial, sans-serif;
  background:#0f2027;
  color:#fff;
}
.header{
  padding:16px;
  text-align:center;
}
.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:14px;
  padding:16px;
}
.card{
  background:#fff;
  border-radius:14px;
  overflow:hidden;
  text-decoration:none;
  color:#000;
}
.card img{
  width:100%;
  height:140px;
  object-fit:cover;
}
.card .info{
  padding:10px;
  font-size:0.85rem;
  font-weight:600;
}
.badge{
  background:#ff7a18;
  color:#fff;
  font-size:0.7rem;
  padding:3px 8px;
  border-radius:999px;
  display:inline-block;
  margin-bottom:6px;
}
.back{
  display:block;
  text-align:center;
  margin:20px;
  color:#fff;
  text-decoration:none;
  opacity:.8;
}
</style>
</head>

<body>

<div class="header">
  <h2>🍜 Makanan Viral TikTok</h2>
  <p>Pilih produk & langsung beli di Shopee</p>
</div>

<div class="grid">

  <!-- PRODUK 1 -->
  <a class="card" href="https://collshp.com/PRODUK1" target="_blank">
    <img src="produk/snack.jpg">
    <div class="info">
      <span class="badge">HOT</span><br>
      Snack Pedas Viral TikTok
    </div>
  </a>

  <!-- PRODUK 2 -->
  <a class="card" href="https://collshp.com/PRODUK2" target="_blank">
    <img src="produk/mie.jpg">
    <div class="info">
      <span class="badge">BEST</span><br>
      Mie Level Pedas Favorit
    </div>
  </a>

  <!-- PRODUK 3 -->
  <a class="card" href="https://collshp.com/PRODUK3" target="_blank">
    <img src="produk/minuman.jpg">
    <div class="info">
      <span class="badge">DISKON</span><br>
      Minuman Segar Kekinian
    </div>
  </a>

</div>

<a class="back" href="index.html">⬅️ Kembali ke Home</a>

</body>
</html>
